<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#061826" />
    <title>추모맵 앱으로 이동</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #061826;
        --navy-soft: #0d2a3d;
        --mint: #35d6b2;
        --mint-dark: #0f8f77;
        --white: #ffffff;
        --line: rgba(255, 255, 255, 0.18);
        --muted: #c9d7dd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--navy);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        color: var(--white);
      }

      main {
        width: min(100%, 420px);
      }

      .shell {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, var(--navy-soft), var(--navy));
        padding: 28px 22px 22px;
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: var(--mint);
        color: var(--navy);
        font-size: 22px;
        font-weight: 900;
      }

      .brand-text {
        display: grid;
        gap: 2px;
      }

      .brand-name {
        font-size: 19px;
        font-weight: 800;
        line-height: 1.1;
      }

      .brand-sub {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .lead {
        margin: 14px 0 0;
        color: #dce8ec;
        font-size: 15px;
        line-height: 1.65;
      }

      .notice {
        margin: 22px 0 0;
        border: 1px solid rgba(53, 214, 178, 0.35);
        border-radius: 8px;
        background: rgba(53, 214, 178, 0.08);
        padding: 13px 14px;
        color: #e9fffa;
        font-size: 13px;
        line-height: 1.55;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 8px;
        padding: 0 16px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 800;
      }

      .primary {
        background: var(--mint);
        color: var(--navy);
      }

      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: var(--white);
      }

      .status {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      @media (min-width: 720px) {
        .shell {
          padding: 34px 30px 28px;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-label="추모맵 앱 이동 안내">
        <div class="brand">
          <div class="mark" aria-hidden="true">M</div>
          <div class="brand-text">
            <div class="brand-name">추모맵</div>
            <div class="brand-sub">장례식장, 추모시설, 상조 비교</div>
          </div>
        </div>

        <h1>추모맵으로 바로 이동합니다</h1>
        <p class="lead">
          Android에서는 Google Play로, iPhone과 PC에서는 추모맵 웹앱으로 안내합니다.
        </p>

        <p class="notice">
          카카오톡, 네이버 등 인앱 브라우저에서는 이동이 제한될 수 있습니다.
          문제가 있으면 외부 브라우저에서 열어 주세요.
        </p>

        <div class="actions">
          <a class="primary" id="installLink" href="https://play.google.com/store/apps/details?id=com.atomcare.memorimap">추모맵 앱 설치하기</a>
          <a class="secondary" id="webLink" href="https://memorimap.kr/">웹에서 바로 보기</a>
        </div>

        <p class="status" id="statusText" role="status" aria-live="polite">잠시 후 자동으로 이동합니다.</p>
      </section>
    </main>

    <script>
      (function () {
        var playUrl = 'https://play.google.com/store/apps/details?id=com.atomcare.memorimap';
        var webUrl = 'https://memorimap.kr/';
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isInApp = /KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line/i.test(ua);
        var statusText = document.getElementById('statusText');
        var destination = isAndroid ? playUrl : webUrl;

        if (statusText) {
          statusText.textContent = isAndroid
            ? '앱이 자동으로 열리지 않으면 Google Play로 이동합니다.'
            : '추모맵 웹앱으로 이동합니다.';

          if (isInApp) {
            statusText.textContent += ' 인앱 브라우저에서는 버튼을 직접 눌러 주세요.';
          }
        }

        window.setTimeout(function () {
          window.location.replace(destination);
        }, isInApp ? 2200 : 1400);
      })();
    </script>
  </body>
</html>
