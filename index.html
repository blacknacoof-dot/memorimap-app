<body>
  <!-- [KakaoTalk Optimization] Warning Banner -->
  <div id="kakao-browser-notice" style="display:none;">
    <div
      style="position:fixed; top:0; left:0; width:100%; background:#FEE500; padding:12px; text-align:center; z-index:10000; box-shadow:0 2px 8px rgba(0,0,0,0.1);">

      <p style="margin:5px 0 0 0; font-size:12px; color:#666;">
        우측 상단 [...] → Safari/Chrome에서 열기
      </p>
      <button onclick="openInExternalBrowser()" 
        style="margin-top:8px; padding:8px 16px; background:#000; color:#FEE500; border:none; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer;">
        👆 바로 열기
      </button>
    </div>
  </div>

  <div id="root"></div>

  <!-- Vite Entry Point -->
  <script type="module" src="/index.tsx"></script>

  <!-- [KakaoTalk Optimization] Detection Script -->
  <script>
    function isKakaoInAppBrowser() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.includes('kakaotalk');
    }

    function isInAppBrowser() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.includes('kakaotalk') || 
             ua.includes('instagram') || 
             ua.includes('naver') ||
             ua.includes('fb_iab') || // Facebook
             ua.includes('line');
    }

    function openInExternalBrowser() {
      const currentUrl = window.location.href;
      
      // iOS
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // iOS에서는 Safari로 열기
        window.location.href = 'x-safari-https://' + currentUrl.replace(/^https?:\/\//, '');
      } 
      // Android
      else if (/Android/.test(navigator.userAgent)) {
        // Chrome 인텐트
        window.location.href = 'intent://' + currentUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      }
      
      // Fallback: 일반 URL로 리다이렉션 시도
      setTimeout(function() {
        window.open(currentUrl, '_blank');
      }, 500);
    }

    // Run on load
    if (isInAppBrowser()) {
      const banner = document.getElementById('kakao-browser-notice');
      if (banner) {
        banner.style.display = 'block';
        document.body.style.paddingTop = '70px';
      }
      
      // 자동으로 외부 브라우저 열기 (선택적)
      // openInExternalBrowser();
    }
  </script>
</body>
